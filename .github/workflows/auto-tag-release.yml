name: Auto-tag release on merge to main

# Dokploy en esta app está configurado con triggerType: "tag" — despliega
# solo cuando se empuja un tag git (vX.Y.Z), no en cada push/merge a main.
# El flujo de release del equipo termina con un merge a main cuyo mensaje
# menciona la versión (ej. "Release v0.12.0", "release: v0.11.0 — ...", o
# "Merge pull request #N from AppToGo/release/v0.10.0"), pero el tag en sí
# se creaba a mano — y a veces se olvidaba, dejando la release sin desplegar
# aunque el código ya estuviera en main.
#
# Este workflow cierra ese hueco: en cada push a main, busca un patrón
# vX.Y.Z en el mensaje del commit que disparó el push. Si lo encuentra y ese
# tag todavía no existe, lo crea y lo empuja — lo cual dispara el webhook de
# Dokploy automáticamente. Si el push a main no es una release (no hay
# patrón de versión en el mensaje), el workflow no hace nada.

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extraer versión del mensaje del commit
        id: version
        run: |
          MSG=$(git log -1 --pretty=%B)
          VERSION=$(echo "$MSG" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          if [ -z "$VERSION" ]; then
            echo "No se encontró un patrón vX.Y.Z en el mensaje del commit — no es un merge de release, no se hace nada."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Versión detectada: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Verificar si el tag ya existe
        if: steps.version.outputs.skip == 'false'
        id: check_tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "El tag ${{ steps.version.outputs.version }} ya existe — no se hace nada."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Crear y empujar el tag
        if: steps.version.outputs.skip == 'false' && steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"
          echo "### 🏷️ Tag \`${{ steps.version.outputs.version }}\` creado y empujado" >> "$GITHUB_STEP_SUMMARY"
          echo "Esto dispara el deploy automático en Dokploy." >> "$GITHUB_STEP_SUMMARY"
